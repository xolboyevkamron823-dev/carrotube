# CarroTube CI
#  - dsp-tests : builds the shared C++ DSP core on Linux and runs the unit tests
#  - ios       : builds an UNSIGNED .ipa on a macOS runner (no Apple account needed);
#                sign/install it with Sideloadly or AltStore (see README.md)
name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run DSP unit tests
        run: |
          cmake -S packages/carro_native/tests -B build/dsp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/dsp -j 4
          ctest --test-dir build/dsp --output-on-failure

  android:
    runs-on: ubuntu-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build APKs (one per ABI, debug-key signed for sideloading)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: CarroTube-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk

  ios:
    runs-on: macos-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Flutter info
        run: |
          flutter --version
          xcodebuild -version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry ../CarroTube-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CarroTube-ios-unsigned-ipa
          path: build/CarroTube-unsigned.ipa
          retention-days: 30
      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/CarroTube-unsigned.ipa
