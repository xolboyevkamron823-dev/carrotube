name: carrotube
description: "YouTube / YouTube Music style player whose audio runs through a Pioneer Carrozzeria DSP replica."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  youtube_explode_dart: ^3.1.0
  sqflite: ^2.4.4
  path_provider: ^2.1.6
  path: ^1.9.1
  cached_network_image: ^4.0.2
  http: ^1.6.0
  ffi: ^2.2.0
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  intl: ^0.20.3
  collection: ^1.19.1
  carro_native:
    path: packages/carro_native

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/carro/
